<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miniagent · Unified Workspace</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">

  <!-- ── Sidebar ──────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">M</div>
      <h2>Miniagent</h2>
      <button class="btn-new" onclick="newTask()" title="New Task">+ New</button>
    </div>

    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input class="search-input" id="searchInput" type="text" placeholder="搜索任务..." oninput="filterTasks()">
    </div>

    <div class="task-list" id="taskList"></div>

    <div class="sidebar-section" id="skillSection">
      <div class="ss-header" onclick="toggleSkillPanel()">
        <span class="ss-title">🛠 Skills</span>
        <span class="ss-count" id="skillCount">0</span>
        <span class="ss-chevron" id="skillChevron">▼</span>
      </div>
      <div class="ss-body" id="skillPanel">
        <div class="skill-search-wrap">
          <input class="skill-search" id="skillSearch" type="text" placeholder="搜索技能..." oninput="filterSkills()">
          <button class="skill-mini-btn" onclick="event.stopPropagation(); openSkillImport()" title="导入技能">⬆</button>
          <button class="skill-mini-btn" onclick="event.stopPropagation(); loadSkills()" title="刷新技能列表">⟳</button>
        </div>
        <div class="skill-list" id="skillList"></div>
      </div>
    </div>

    <div class="sidebar-footer">
      <span class="dot"></span>
      <span style="flex:1">Miniagent v0.1</span>
      <button class="btn-header" onclick="openSettings()" title="设置" style="width:26px;height:26px;font-size:13px">⚙</button>
    </div>
  </aside>

  <!-- 拖拽调宽分隔条：左栏 ↔ 主面板 -->
  <div class="grip" id="gripLeft" title="拖动调整侧栏宽度"></div>

  <!-- ── Main column ──────────────────────────────────────── -->
  <div class="main">
    <div class="chat-header">
      <button class="btn-header" id="btnToggleSidebar" onclick="toggleSidebar()" title="Toggle sidebar">≡</button>
      <div class="ct-titles">
        <div class="ct-mode">
          <span class="mode-pill" id="modePill">⚙ Workflow</span>
          <span id="modelSummary">—</span>
        </div>
        <h3 id="chatTitle"></h3>
      </div>
      <div class="stage-pills" id="stagePills"></div>
      <button class="model-chip active" id="modelChip" onclick="openSettings('models')" title="点击切换/管理 LLM 模型">
        <span class="mc-icon" id="modelChipIcon">🐳</span>
        <span class="mc-name" id="modelChipName">—</span>
        <span class="mc-caret">▾</span>
      </button>
      <button class="btn-cancel" id="btnCancel" onclick="cancelTask()" title="Cancel running task">■ Stop</button>
      <button class="btn-header" id="btnToggleRight" onclick="toggleRightPanel()" title="Toggle progress / files panel">⇆</button>
    </div>

    <div class="conn-bar connected" id="connBar">
      <span class="cb-dot"></span>
      <span id="connText">已连接</span>
      <span style="flex:1"></span>
      <span id="connMeta"></span>
    </div>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🤖</div>
        <h2>Miniagent</h2>
        <p>统一科研工作流：文献 → 知识图谱 → 致病机理假说 → 辩论 → 验证计划 → 数据分析。</p>
        <div class="welcome-tips">
          <div class="welcome-tip" onclick="useTip('Summarize recent advances in CRISPR gene editing')">CRISPR Research</div>
          <div class="welcome-tip" onclick="useTip('Compare BERT and GPT architectures')">BERT vs GPT</div>
          <div class="welcome-tip" onclick="useTip('Analyze the pros and cons of Rust vs Go')">Rust vs Go</div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="file-chips" id="fileChips"></div>
      <div class="file-chips" id="skillChips"></div>
      <div class="input-row">
        <button class="btn-upload" onclick="document.getElementById('fileInput').click()" title="Upload file">📎</button>
        <select id="modeSelect" class="mode-select" title="选择工作流模式">
          <option value="workflow">⚙ Workflow</option>
          <option value="loop">🔄 Loop</option>
          <option value="debate">⚖ Debate</option>
          <option value="research">🔬 Research</option>
        </select>
        <input type="file" id="fileInput" multiple hidden accept=".txt,.md,.pdf,.csv,.tsv,.json,.py,.rs,.js,.ts,.html,.css,.ipynb,.png,.jpg,.svg,.xlsx,.xls,.xlsm">
        <select id="agentSelect" class="mode-select agent-select" title="指定执行智能体（留空 = 自动分配）" onchange="onAgentSelectChange()">
          <option value="">🤖 自动</option>
        </select>
        <div class="input-wrap">
          <textarea id="input" rows="1" placeholder="Ask anything..." onkeydown="handleKey(event)"></textarea>
        </div>
        <button class="btn-send" id="btnSend" onclick="sendMessage()">▶</button>
      </div>
    </div>
  </div>

  <!-- 拖拽调宽分隔条：主面板 ↔ 右栏 -->
  <div class="grip" id="gripRight" title="拖动调整右栏宽度"></div>

  <!-- ── Right panel ─────────────────────────────────────── -->
  <aside class="right-panel" id="rightPanel">
    <div class="rp-tabs">
      <button class="rp-tab active" data-tab="progress" onclick="switchRightTab('progress')">📊 Progress</button>
      <button class="rp-tab" data-tab="files" onclick="switchRightTab('files')">📁 Files</button>
    </div>
    <div class="rp-content" id="rpContent">
      <div id="rpProgress"></div>
      <div id="rpGoal" style="display:none"></div>

      <div id="rpFiles" style="display:none"></div>
    </div>
  </aside>

  <button id="sidebarReopen" class="float-reopen left" onclick="expandSidebar()" title="Show sidebar" style="display:none">≡</button>
  <button id="rightReopen" class="float-reopen right" onclick="expandRightPanel()" title="Show files panel" style="display:none">📁</button>
</div>

<div class="drag-overlay" id="dragOverlay">
  <div class="inner">
    <div style="font-size:40px">📄</div>
    <p>Drop files here</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ── 技能查看 / 导入 弹窗 ───────────────────────────────────── -->
<div class="settings-overlay" id="skillModal" onclick="if(event.target===this)closeSkillModal()">
  <div class="settings-drawer skill-drawer" role="dialog" aria-label="技能">
    <div class="settings-head">
      <h3 id="skillModalTitle"><span class="sh-icon">🛠</span><span>技能</span></h3>
      <button class="preview-close" onclick="closeSkillModal()" title="Close">×</button>
    </div>
    <div class="settings-body" id="skillModalBody"></div>
  </div>
</div>

<!-- ── Unified settings drawer (Round 36) ─────────────────── -->
<div class="settings-overlay" id="settingsOverlay" onclick="if(event.target===this)closeSettings()">
  <div class="settings-drawer" role="dialog" aria-label="设置">
    <div class="settings-head">
      <h3><span class="sh-icon">⚙</span><span>设置</span></h3>
      <button class="preview-close" onclick="closeSettings()" title="Close">×</button>
    </div>
    <div class="settings-tabs" id="settingsTabs">
      <button class="settings-tab active" data-tab="models" onclick="switchSettingsTab('models')">
        <span>🤖</span> 模型
      </button>
      <button class="settings-tab" data-tab="agents" onclick="switchSettingsTab('agents')">
        <span>🧑‍💼</span> 智能体
      </button>
      <button class="settings-tab" data-tab="debate" onclick="switchSettingsTab('debate')">
        <span>⚖</span> 辩论角色
      </button>
      <button class="settings-tab" data-tab="memory" onclick="switchSettingsTab('memory')">
        <span>🧠</span> 记忆
      </button>
      <button class="settings-tab" data-tab="about" onclick="switchSettingsTab('about')">
        <span>ℹ</span> 关于
      </button>
    </div>
    <div class="settings-body" id="settingsBody">
      <div class="skeleton" style="height:120px;margin-bottom:12px"></div>
      <div class="skeleton" style="height:80px;margin-bottom:12px"></div>
      <div class="skeleton" style="height:80px"></div>
    </div>
  </div>
</div>

<script src="/marked.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
